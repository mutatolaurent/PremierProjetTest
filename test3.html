<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Test rem vs em</title>
    <style>
      /* Base globale */
      html {
        font-size: 16px;
      }

      body {
        font-family: sans-serif;
        padding: 2rem;
      }

      /* Carte */
      .card {
        font-size: 2rem; /* ← BASE DU COMPOSANT */
        padding: 1.5em;
        border: 1px solid #ccc;
        width: 20rem;
      }

      /* Texte */
      .card h2 {
        font-size: 1.5em;
        margin-bottom: 0.5em;
      }

      .card p {
        margin-bottom: 1em;
      }

      .small {
        font-size: 0.8em;
        color: #666;
      }

      /* Bouton */
      .btn {
        font-size: 1em;
        /* padding: 0.6em 1.2em; */
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Titre de la carte</h2>
      <p>
        Ceci est un texte normal.
        <span class="small">Texte secondaire</span>
      </p>
      <button class="btn">Action</button>
    </div>
  </body>
</html>
